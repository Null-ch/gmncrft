services:
  mc:
    image: itzg/minecraft-server:java21
    container_name: mc-forge
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-25565}:25565"
    stdin_open: true
    tty: true
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      # Ставим Forge из уже скачанного installer-jar (лежит в корне репозитория,
      # монтируется ниже) - без обращения к maven.minecraftforge.net на каждый чистый старт.
      FORGE_INSTALLER: "/forge-installer.jar"

      MEMORY: "${MEMORY:-4G}"
      MOTD: "${MOTD:-A Forge 1.21.1 Server}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      MODE: "${MODE:-survival}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-10}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-10}"
      SPAWN_PROTECTION: "${SPAWN_PROTECTION:-0}"
      ALLOW_NETHER: "${ALLOW_NETHER:-true}"
      PVP: "${PVP:-true}"
      ONLINE_MODE: "${ONLINE_MODE:-true}"
      # WHITELIST/OPS через env резолвят UUID по Mojang/PlayerDB API, что не совпадает
      # с offline-UUID при ONLINE_MODE=false. Поэтому в offline-режиме whitelist только
      # включается здесь (ENABLE_WHITELIST), а игроки/операторы добавляются вручную через
      # консоль (scripts/console.sh -> whitelist add <ник> / op <ник>) - см. README.
      ENABLE_WHITELIST: "${ENABLE_WHITELIST:-false}"
      WHITELIST: "${WHITELIST:-}"
      OPS: "${OPS:-}"
      ICON: "${ICON:-}"
      TZ: "${TZ:-UTC}"

      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"
      RCON_PORT: "25575"

      FORGE_FORCE_REINSTALL: "${FORGE_FORCE_REINSTALL:-false}"
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
      # Конфиги модов (сейчас: config/loginsystem.properties) - копируются в /data/config
      # при каждом старте контейнера, так они не теряются и не расходятся с репозиторием.
      - ./config:/config:ro
      - ./${FORGE_INSTALLER_FILE:-forge-1.21.1-52.1.16-installer.jar}:/forge-installer.jar:ro
    networks:
      - mc-net
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 5m
      interval: 30s
      retries: 10

  backup:
    image: itzg/mc-backup
    container_name: mc-backup
    restart: unless-stopped
    depends_on:
      - mc
    environment:
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-24h}"
      INITIAL_DELAY: "2m"
      PRUNE_BACKUPS_DAYS: "${PRUNE_BACKUPS_DAYS:-7}"
      RCON_HOST: "mc"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"
      BACKUP_METHOD: "tar"
      TAR_COMPRESS_METHOD: "gzip"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    networks:
      - mc-net

  link-server:
    build:
      context: ./link-server
    container_name: mc-link-server
    restart: unless-stopped
    environment:
      PORT: "8080"
      # Простой пароль для скачивания /backup/file и /client/file - своя HTML-форма
      # в стиле сайта (не нативный Basic Auth диалог браузера, его нельзя стилизовать).
      DOWNLOAD_PASSWORD: "${DOWNLOAD_PASSWORD:?set DOWNLOAD_PASSWORD in .env}"
      # Репозиторий смонтирован read-only ниже - чтобы отдавать backups/*.tar.gz, брать
      # моды и forge-installer.jar для автосборки client-pack.zip при каждом старте
      # (build-client-pack.js). Сам собранный zip пишется в writable /app (не в /repo).
      BACKUP_DIR: "/repo/backups"
      CLIENT_PACK_PATH: "/app/client-pack.zip"
      MODS_DIR: "/repo/mods"
      SERVER_ADDRESS: "${SERVER_ADDRESS:-2.26.224.164:25565}"
      MOTD: "${MOTD:-A Forge 1.21.1 Server}"
      FORGE_INSTALLER_FILE: "${FORGE_INSTALLER_FILE:-forge-1.21.1-52.1.16-installer.jar}"
    # Порт наружу НЕ публикуется - снаружи достучаться можно только через caddy.
    volumes:
      - .:/repo:ro
    networks:
      - mc-net

  caddy:
    image: caddy:2-alpine
    container_name: mc-caddy
    restart: unless-stopped
    depends_on:
      - link-server
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${LINK_DOMAIN:?set LINK_DOMAIN in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mc-net

networks:
  mc-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
