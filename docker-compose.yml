services:
  mc:
    image: itzg/minecraft-server:java25
    container_name: mc-fabric
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-25565}:25565"
    stdin_open: true
    tty: true
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      # Minecraft 26.1.x требует Java 25 (отсюда тег образа java25).
      VERSION: "${MC_VERSION:-26.1.2}"
      # Fabric ставится из уже скачанного server launcher-jar (лежит в корне репозитория,
      # монтируется ниже): версии Minecraft и loader зашиты в сам jar.
      FABRIC_LAUNCHER: "/fabric-server-launcher.jar"
      # /data/mods каждый старт собирается заново из ./mods - иначе удалённые из mods/
      # jar (в т.ч. старые Forge-моды) остаются в data/mods и роняют Fabric при загрузке.
      REMOVE_OLD_MODS: "TRUE"
      # server-fixes - правки рецептов, сломанных Clutter No More (см. README).
      DATAPACKS: "/datapacks/server-fixes"

      MEMORY: "${MEMORY:-4G}"
      MOTD: "${MOTD:-A Fabric 26.1.2 Server}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      MODE: "${MODE:-survival}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-10}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-10}"
      SPAWN_PROTECTION: "${SPAWN_PROTECTION:-0}"
      ALLOW_NETHER: "${ALLOW_NETHER:-true}"
      PVP: "${PVP:-true}"
      ONLINE_MODE: "${ONLINE_MODE:-true}"
      # WHITELIST/OPS через env резолвят UUID по Mojang/PlayerDB API, что не совпадает
      # с offline-UUID при ONLINE_MODE=false. Поэтому в offline-режиме whitelist только
      # включается здесь (ENABLE_WHITELIST), а игроки/операторы добавляются вручную через
      # консоль (scripts/console.sh -> whitelist add <ник> / op <ник>) - см. README.
      ENABLE_WHITELIST: "${ENABLE_WHITELIST:-false}"
      WHITELIST: "${WHITELIST:-}"
      OPS: "${OPS:-}"
      ICON: "${ICON:-}"
      TZ: "${TZ:-UTC}"

      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"
      RCON_PORT: "25575"

      FABRIC_FORCE_REINSTALL: "${FABRIC_FORCE_REINSTALL:-false}"
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
      # Датапаки из репозитория - образ копирует перечисленные в DATAPACKS в world/datapacks.
      - ./datapacks:/datapacks:ro
      - ./${FABRIC_LAUNCHER_FILE:-fabric-server-mc.26.1.2-loader.0.19.5-launcher.1.1.2.jar}:/fabric-server-launcher.jar:ro
    networks:
      - mc-net
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 5m
      interval: 30s
      retries: 10

  backup:
    image: itzg/mc-backup
    container_name: mc-backup
    restart: unless-stopped
    depends_on:
      - mc
    environment:
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-24h}"
      INITIAL_DELAY: "2m"
      PRUNE_BACKUPS_DAYS: "${PRUNE_BACKUPS_DAYS:-7}"
      RCON_HOST: "mc"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"
      BACKUP_METHOD: "tar"
      TAR_COMPRESS_METHOD: "gzip"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    networks:
      - mc-net

  link-server:
    build:
      context: ./link-server
    container_name: mc-link-server
    restart: unless-stopped
    environment:
      PORT: "8080"
      # Простой пароль для скачивания /backup/file и /client/file - своя HTML-форма
      # в стиле сайта (не нативный Basic Auth диалог браузера, его нельзя стилизовать).
      DOWNLOAD_PASSWORD: "${DOWNLOAD_PASSWORD:?set DOWNLOAD_PASSWORD in .env}"
      # Репозиторий смонтирован read-only ниже - чтобы отдавать backups/*.tar.gz, брать
      # моды и fabric-installer-*.jar для автосборки client-pack.zip при каждом старте
      # (build-client-pack.js). Сам собранный zip пишется в writable /app (не в /repo).
      BACKUP_DIR: "/repo/backups"
      CLIENT_PACK_PATH: "/app/client-pack.zip"
      MODS_DIR: "/repo/mods"
      # Шейдерпаки (.zip) - попадают в архив для клиента в папку shaderpacks/.
      SHADERS_DIR: "/repo/shaders"
      # Текстур-паки (.zip) - в архив для клиента в папку resourcepacks/.
      RESOURCE_PACKS_DIR: "/repo/resourcepacks"
      SERVER_ADDRESS: "${SERVER_ADDRESS:-2.26.224.164:25565}"
      MOTD: "${MOTD:-A Fabric 26.1.2 Server}"
      # Из имени серверного launcher-jar сайт берёт версии Minecraft и Fabric loader.
      FABRIC_LAUNCHER_FILE: "${FABRIC_LAUNCHER_FILE:-fabric-server-mc.26.1.2-loader.0.19.5-launcher.1.1.2.jar}"
      # Заявки на игру: хранятся в /data (том ниже), одобренный ник добавляется в
      # whitelist через RCON контейнера mc. BOT_API_TOKEN - для Discord-бота (/api/applications).
      APPLICATIONS_FILE: "/data/applications.json"
      WHITELIST_FILE: "/repo/data/whitelist.json"
      BOT_API_TOKEN: "${BOT_API_TOKEN:-}"
      # Настройки игры - только для показа на главной (режим, PvP, бэкапы, лицензия).
      # Онлайн, игроков, игровой день и сложность главная берёт у mc по RCON.
      GAME_MODE: "${MODE:-survival}"
      PVP: "${PVP:-true}"
      ONLINE_MODE: "${ONLINE_MODE:-true}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-24h}"
      RCON_HOST: "mc"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"
    # Порт наружу НЕ публикуется - снаружи достучаться можно только через caddy.
    volumes:
      - .:/repo:ro
      - ./link-data:/data
    networks:
      - mc-net

  caddy:
    image: caddy:2-alpine
    container_name: mc-caddy
    restart: unless-stopped
    depends_on:
      - link-server
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${LINK_DOMAIN:?set LINK_DOMAIN in .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mc-net

networks:
  mc-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
