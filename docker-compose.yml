services:
  mc:
    image: itzg/minecraft-server:java21
    container_name: mc-forge
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-25565}:25565"
    stdin_open: true
    tty: true
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      # Ставим Forge из уже скачанного installer-jar (лежит в корне репозитория,
      # монтируется ниже) - без обращения к maven.minecraftforge.net на каждый чистый старт.
      FORGE_INSTALLER: "/forge-installer.jar"

      MEMORY: "${MEMORY:-4G}"
      MOTD: "${MOTD:-A Forge 1.21.1 Server}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      MODE: "${MODE:-survival}"
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-10}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-10}"
      SPAWN_PROTECTION: "${SPAWN_PROTECTION:-0}"
      ALLOW_NETHER: "${ALLOW_NETHER:-true}"
      PVP: "${PVP:-true}"
      ONLINE_MODE: "${ONLINE_MODE:-true}"
      # WHITELIST/OPS через env резолвят UUID по Mojang/PlayerDB API, что не совпадает
      # с offline-UUID при ONLINE_MODE=false. Поэтому в offline-режиме whitelist только
      # включается здесь (ENABLE_WHITELIST), а игроки/операторы добавляются вручную через
      # консоль (scripts/console.sh -> whitelist add <ник> / op <ник>) - см. README.
      ENABLE_WHITELIST: "${ENABLE_WHITELIST:-false}"
      WHITELIST: "${WHITELIST:-}"
      OPS: "${OPS:-}"
      ICON: "${ICON:-}"
      TZ: "${TZ:-UTC}"

      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"
      RCON_PORT: "25575"

      FORGE_FORCE_REINSTALL: "${FORGE_FORCE_REINSTALL:-false}"
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
      - ./${FORGE_INSTALLER_FILE:-forge-1.21.1-52.1.16-installer.jar}:/forge-installer.jar:ro
    networks:
      - mc-net
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 5m
      interval: 30s
      retries: 10

  backup:
    image: itzg/mc-backup
    container_name: mc-backup
    restart: unless-stopped
    depends_on:
      - mc
    environment:
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-24h}"
      INITIAL_DELAY: "2m"
      PRUNE_BACKUPS_DAYS: "${PRUNE_BACKUPS_DAYS:-7}"
      RCON_HOST: "mc"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD in .env}"
      BACKUP_METHOD: "tar"
      TAR_COMPRESS_METHOD: "gzip"
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    networks:
      - mc-net

  link-server:
    image: node:22-bookworm-slim
    container_name: mc-link-server
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server.js"]
    environment:
      TOKEN: "${BACKUP_LINK_TOKEN:?set BACKUP_LINK_TOKEN in .env}"
      PORT: "8080"
      # Весь репозиторий смонтирован read-only ниже - чтобы отдавать backups/*.tar.gz
      # и client-pack.zip, не завися от того, создан ли файл на момент старта контейнера.
      BACKUP_DIR: "/repo/backups"
      CLIENT_PACK_PATH: "/repo/client-pack.zip"
    # Порт наружу НЕ публикуется - снаружи достучаться можно только через caddy
    # (HTTPS + Basic Auth), см. сервис ниже. Внутри docker-сети токен остаётся
    # как дополнительный уровень защиты.
    volumes:
      - ./link-server/server.js:/app/server.js:ro
      - .:/repo:ro
    networks:
      - mc-net

  caddy:
    image: caddy:2-alpine
    container_name: mc-caddy
    restart: unless-stopped
    depends_on:
      - link-server
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${LINK_DOMAIN:?set LINK_DOMAIN in .env}"
      BACKUP_LINK_TOKEN: "${BACKUP_LINK_TOKEN:?set BACKUP_LINK_TOKEN in .env}"
      # bcrypt-хеш BACKUP_LINK_TOKEN для HTTP Basic Auth - генерируется
      # scripts/setup-caddy-auth.sh, сам plaintext-токен в Caddyfile не попадает.
      BASIC_AUTH_HASH: "${BASIC_AUTH_HASH:?run scripts/setup-caddy-auth.sh first}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mc-net

networks:
  mc-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
