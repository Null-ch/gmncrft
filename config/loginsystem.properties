# Конфиг мода LoginSystem - копируется в /data/config при каждом старте контейнера
# (см. docker-compose.yml, том ./config:/config), поэтому правки делать здесь,
# а не через веб-панель/в контейнере - иначе слетят при следующем рестарте.

# Встроенная веб-панель администратора мода ВЫКЛЮЧЕНА намеренно:
# - в поставке дефолтный пароль webPanelPassword=admin123
# - в интерфейсе панели часть паролей игроков показывается в открытом виде
#   (унаследовано от старого нехешированного формата хранения)
# Управление игроками и так есть через RCON (scripts/console.sh) и наш сайт (/minecraft* в боте).
enableWebPanel=false

# Пароли хранятся в локальном файле (config/loginsystem/playerdata), MySQL/MariaDB не нужен.
enableDatabase=false

# Сколько секунд даётся на /register или /login, прежде чем кикнет по таймауту
# (по умолчанию 60). Увеличено, чтобы не поджимать по времени.
loginTimeout=180

# Координаты зоны ожидания, куда телепортирует незалогиненного игрока. По умолчанию
# (0, 100, 0) - в воздухе в пустоте, из-за чего ванильный анти-чит "полёта" кикает
# игрока через несколько секунд ("kicked for floating too long") ещё ДО истечения
# loginTimeout - сама по себе эта настройка проблему не решала. Ниже - координаты,
# где игрок реально стоял на земле (из логов сервера); если после смены мира/спавна
# перестанет подходить, узнать актуальные безопасные координаты можно, например,
# заставив игрока встать там, где не кикает, и посмотреть его позицию в логе при join.
waitingAreaX=-395
waitingAreaY=64
waitingAreaZ=369
